<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Attest architecture — agent graph, evidence verifier, two human gates, and runtime surfaces</title>
  <desc>A clinical note is read by the intake specialist, routed to the payer's policy pack by find_pack, matched criterion by criterion by the criteria specialist, and every quote checked verbatim by a deterministic verifier before the packet specialist assembles a justification. Gate 1 requires a named clinician before any submission artifact exists. A denial letter arrives separately, the appeal specialist drafts rebuttals, and Gate 2 requires approval again before the appeal is emitted and filed as precedent. The whole pipeline runs on Streamlit Community Cloud, from a terminal, or on Amazon Bedrock AgentCore Runtime.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="700" fill="#ffffff"/>

  <!-- ── title ───────────────────────────────────────────────────────────── -->
  <text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Attest — the prior-authorization lifecycle, end to end</text>
  <text x="40" y="60" font-size="13.5" fill="#475569">Built on Strands Agents. Every clinical claim is traceable to a verified quote, and two hard gates stop the agent until a clinician approves.</text>

  <!-- legend -->
  <rect x="742" y="24" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="762" y="35" font-size="12" fill="#334155">Strands agent</text>
  <rect x="856" y="24" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#475569"/>
  <text x="876" y="35" font-size="12" fill="#334155">deterministic code</text>
  <rect x="1010" y="24" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="1030" y="35" font-size="12" fill="#334155">human gate</text>
  <rect x="856" y="46" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="876" y="57" font-size="12" fill="#334155">artifact</text>

  <!-- ── panel A — the submission ────────────────────────────────────────── -->
  <text x="40" y="98" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.6">1 · THE SUBMISSION</text>

  <rect x="40" y="110" width="200" height="72" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="140" font-size="14" font-weight="600" fill="#0f172a">Clinical note</text>
  <text x="56" y="160" font-size="12" fill="#64748b">uploaded — nothing preloaded</text>

  <rect x="280" y="110" width="200" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="296" y="140" font-size="14" font-weight="600" fill="#1e3a8a">intake_specialist</text>
  <text x="296" y="160" font-size="12" fill="#1e40af">structured case · PA required?</text>

  <rect x="520" y="110" width="200" height="72" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="536" y="140" font-size="14" font-weight="600" fill="#1e293b">find_pack()</text>
  <text x="536" y="160" font-size="12" fill="#475569">payer's policy, derived</text>

  <rect x="760" y="110" width="200" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="776" y="140" font-size="14" font-weight="600" fill="#1e3a8a">criteria_specialist</text>
  <text x="776" y="160" font-size="12" fill="#1e40af">met · not met · insufficient</text>

  <line x1="240" y1="146" x2="274" y2="146" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="146" x2="514" y2="146" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="720" y1="146" x2="754" y2="146" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M 860 182 L 860 206 L 140 206 L 140 224" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="230" width="200" height="72" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="56" y="260" font-size="14" font-weight="600" fill="#1e293b">evidence verifier</text>
  <text x="56" y="280" font-size="12" fill="#475569">verbatim, or the quote is cut</text>

  <rect x="280" y="230" width="200" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="296" y="260" font-size="14" font-weight="600" fill="#1e3a8a">packet_specialist</text>
  <text x="296" y="280" font-size="12" fill="#1e40af">gap list · justification</text>

  <rect x="520" y="230" width="200" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="536" y="260" font-size="14" font-weight="700" fill="#78350f">GATE 1 — clinician</text>
  <text x="536" y="280" font-size="12" fill="#92400e">approves a content hash</text>

  <rect x="760" y="230" width="200" height="72" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="776" y="260" font-size="14" font-weight="600" fill="#14532d">submission packet</text>
  <text x="776" y="280" font-size="12" fill="#166534">Markdown + PDF</text>

  <line x1="240" y1="266" x2="274" y2="266" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="266" x2="514" y2="266" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="720" y1="266" x2="754" y2="266" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="40" y="326" font-size="12.5" fill="#475569">No code path emits a document without an <tspan font-weight="600" fill="#334155">ApprovalRecord</tspan> whose hash matches the packet — editing after sign-off invalidates the approval rather than riding on it.</text>

  <!-- ── panel B — the appeal ────────────────────────────────────────────── -->
  <text x="40" y="372" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.6">2 · THE APPEAL</text>

  <rect x="40" y="384" width="200" height="72" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="414" font-size="14" font-weight="600" fill="#0f172a">Denial letter</text>
  <text x="56" y="434" font-size="12" fill="#64748b">arrives days later, uploaded</text>

  <rect x="280" y="384" width="200" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="296" y="414" font-size="14" font-weight="600" fill="#1e3a8a">appeal_specialist</text>
  <text x="296" y="434" font-size="12" fill="#1e40af">contested criteria → rebuttals</text>

  <rect x="520" y="384" width="200" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="536" y="414" font-size="14" font-weight="700" fill="#78350f">GATE 2 — clinician</text>
  <text x="536" y="434" font-size="12" fill="#92400e">a hash covers the case id</text>

  <rect x="760" y="384" width="200" height="72" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="776" y="414" font-size="14" font-weight="600" fill="#14532d">appeal + deadline</text>
  <text x="776" y="434" font-size="12" fill="#166534">filed as precedent</text>

  <line x1="240" y1="420" x2="274" y2="420" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="420" x2="514" y2="420" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="720" y1="420" x2="754" y2="420" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M 860 384 L 860 360 L 380 360 L 380 380" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="430" y="354" font-size="11.5" fill="#64748b">approved language returns as precedent on the next case that contests the same criterion</text>

  <text x="40" y="484" font-size="12.5" fill="#475569">The four specialists are composed with <tspan font-weight="600" fill="#334155">agent.as_tool()</tspan> under one orchestrator: routing decides what runs next, code decides what is true.</text>

  <!-- ── panel C — where it runs ─────────────────────────────────────────── -->
  <line x1="40" y1="524" x2="1140" y2="524" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="552" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.6">3 · WHERE IT RUNS</text>

  <rect x="40" y="566" width="340" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="56" y="592" font-size="13.5" font-weight="600" fill="#0f172a">Streamlit Community Cloud</text>
  <text x="56" y="612" font-size="12" fill="#64748b">attest.streamlit.app — public, no key needed</text>
  <text x="56" y="630" font-size="12" fill="#64748b">the reviewer's console, live for judges</text>

  <rect x="420" y="566" width="340" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="436" y="592" font-size="13.5" font-weight="600" fill="#0f172a">A terminal</text>
  <text x="436" y="612" font-size="12" fill="#64748b">python -m attest.demo --case clean</text>
  <text x="436" y="630" font-size="12" fill="#64748b">no browser, no key, stops at Gate 1</text>

  <rect x="800" y="566" width="340" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="816" y="592" font-size="13.5" font-weight="600" fill="#334155">Amazon Bedrock AgentCore Runtime</text>
  <text x="816" y="612" font-size="12" fill="#64748b">agent_runtime.py — entrypoint written, verified</text>
  <text x="816" y="630" font-size="12" fill="#64748b">not deployed: Bedrock model access pending</text>

  <text x="40" y="674" font-size="12.5" fill="#475569">Model calls replay from committed <tspan font-weight="600" fill="#334155">cassettes/</tspan>, so every surface above reproduces identical results with no API key — Gemini today, Bedrock as a one-constructor swap. <tspan font-weight="600" fill="#b45309">Synthetic data only.</tspan></text>
</svg>

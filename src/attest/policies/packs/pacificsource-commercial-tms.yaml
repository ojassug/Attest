# Criteria quoted from the PacificSource enterprise clinical guideline for TMS (Commercial
# line of business, Section A — Initial TMS Therapy).
#
# Contrast with highmark-hho-de-mp-1147 is deliberate and is the point of shipping two packs:
# PacificSource requires TWO antidepressant trials of >=8 weeks at therapeutic dose PLUS an
# augmentation trial, while Highmark requires FOUR psychopharmacologic trials and adds a
# psychotherapy-failure requirement. Same service, same diagnosis, materially different bar.
pack_id: pacificsource-commercial-tms
payer: PacificSource
plan: Commercial
service: Transcranial magnetic stimulation for major depressive disorder
cpt_codes: ["90867", "90868", "90869"]

source_url: https://pacificsource.com/sites/default/files/2026-07/transcranial-magnetic-stimulation.pdf
source_title: "Transcranial Magnetic Stimulation — PacificSource Enterprise Policy (Commercial)"
retrieved_date: 2026-09-08

pa_required: true
appeal_window_days: 180
appeal_window_source: >-
  NOT STATED in the retrieved clinical guideline. Placeholder pending confirmation against the
  PacificSource commercial member appeal policy. Must be verified before any real filing.

criteria:
  - id: ps-01
    category: provider_qualification
    source_section: "Criteria > Commercial > A. Initial TMS Therapy, item 1"
    polarity: present
    text: >-
      TMS is ordered and supervised by a qualified psychiatrist or Psychiatric Mental Health
      Nurse Practitioner (PMHNP) and supervised by a qualified psychiatrist, nurse
      practitioner, physician, or physician assistant who possesses evidence in knowledge,
      training, and expertise to perform all aspects of the TMS procedure based on the scope
      of practice standards and regulations established by each state

  - id: ps-02
    category: eligibility
    source_section: "Criteria > Commercial > A. Initial TMS Therapy, item 2"
    polarity: present
    text: >-
      Member meets ONE of the following age requirements: 18 years of age or older; 15 - 17
      years old (requires MD Review for approval)

  - id: ps-03
    category: diagnosis
    source_section: "Criteria > Commercial > A. Initial TMS Therapy, item 3"
    polarity: present
    text: >-
      Member has a confirmed diagnosis of severe major depressive disorder (single or
      recurrent episode) without psychosis documented by standardized depression rating scales

  - id: ps-04a
    category: treatment_resistance
    source_section: "Criteria > Commercial > A. Initial TMS Therapy, item 4a"
    polarity: present
    text: >-
      Two antidepressant medications from at least two different classes, having different
      mechanisms of action at the maximally tolerated labeled dose, each used for at least 8
      weeks (to qualify as an adequate antidepressant drug trial, the member's dose during the
      failed trials should have been at or above the minimal effective therapeutic dose for
      that antidepressant

  - id: ps-04b
    category: treatment_resistance
    source_section: "Criteria > Commercial > A. Initial TMS Therapy, item 4b"
    polarity: present
    text: >-
      Augmentation therapy along with the primary antidepressant used for at least 8 weeks; if
      the augmenting agent is an antidepressant, the augmenting agent must be from a different
      class than the primary antidepressant. The augmenting agent should have been at or above
      the minimal effective therapeutic dose (which is typically the minimal labeled dose)

  - id: ps-05a
    category: contraindication
    source_section: "Criteria > Commercial > A. Initial TMS Therapy, item 5a"
    polarity: absent
    text: "Acute or chronic psychotic symptoms or disorders"

  - id: ps-05b
    category: contraindication
    source_section: "Criteria > Commercial > A. Initial TMS Therapy, item 5b"
    polarity: absent
    text: "Implanted devices in or around the head"

  - id: ps-05c
    category: contraindication
    source_section: "Criteria > Commercial > A. Initial TMS Therapy, item 5c"
    polarity: absent
    text: "Seizure disorder or increased risk of seizures"

  - id: ps-06
    category: treatment_plan
    source_section: "Criteria > Commercial > A. Initial TMS Therapy, item 6"
    polarity: present
    text: >-
      Proposed treatment plan is within a standard course of treatment, which includes: 1 unit
      of 90867 treatment planning, up to 36 units of 90868 treatment delivery, and up to 2
      units of 90869 motor threshold redetermination

  - id: ps-07
    category: device
    source_section: "Background, device paragraph"
    polarity: present
    text: >-
      TMS should be administered using a Food and Drug Administration (FDA) cleared device and
      in accordance with the FDA labeled indications

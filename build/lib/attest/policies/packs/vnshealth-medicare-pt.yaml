# Outpatient physical therapy, quoted from the VNS Health Plans clinical guideline for
# PT/OT/ST utilization (Medicare Advantage / MLTC / MMC lines of business).
#
# This pack exists to prove the engine is specialty-agnostic (P7-S2). Nothing in
# src/attest/ knows what TMS or physical therapy is: a specialty is a pack plus a note, and
# adding one costs data rather than code. The source text is committed at
# data/policies/raw/vnshealth-medicare-pt-ot-st.txt.
#
# Why PT is the harder specialty, stated openly. DECISIONS.md records that TMS was chosen
# because its criteria are near-binary, and that PT's central requirement - "meaningful
# functional progress" - is fuzzier and easier to fake convincingly. That is exactly why it is
# worth shipping as the second specialty: pt-06 below is a judgement about whether documented
# measurements actually constitute progress, and the note has to carry real numbers for the
# matcher to say yes.
pack_id: vnshealth-medicare-pt
payer: VNS Health Plans
plan: Medicare Advantage
service: Outpatient physical therapy
cpt_codes: ["97110", "97112", "97116", "97140", "97530"]

source_url: https://www.vnshealthplans.org/wp-content/uploads/2026/05/UM_PT_OT_Utilization_Guidelines.pdf
source_title: >-
  Medicare and Medicaid Clinical Guideline: Outpatient Physical Therapy, Occupational Therapy,
  and Speech Therapy Utilization - VNS Health Plans (Version 1.0)
retrieved_date: 2026-09-09

pa_required: true
appeal_window_days: 60
appeal_window_source: >-
  NOT STATED in the retrieved clinical guideline, which covers utilization criteria only and is
  silent on member appeal rights. Placeholder pending confirmation against the VNS Health Plans
  Medicare Advantage member appeal policy. Must be verified before any real filing.

criteria:
  - id: pt-01
    category: order_and_referral
    source_section: "3. Service Approvals"
    polarity: present
    text: >-
      Ordered by a licensed physician or qualified provider.

  - id: pt-02
    category: medical_necessity
    source_section: "3. Service Approvals"
    polarity: present
    text: >-
      Medically necessary and restorative in nature.

  - id: pt-03
    category: plan_of_care
    source_section: "3. Service Approvals"
    polarity: present
    text: >-
      Delivered under a written plan of care reviewed and certified every 30 days.

  - id: pt-04
    category: baseline_measurement
    source_section: "4. Clinical Criteria > Initial Evaluation & Treatment"
    polarity: present
    text: >-
      Must include objective baseline measurements and functional goals using standardized tools
      (e.g., PROMIS, DASH, Berg Balance Scale).

  - id: pt-05
    category: plan_of_care
    source_section: "4. Clinical Criteria > Treatment Plan Requirements"
    polarity: present
    text: >-
      Plan of care must include: Diagnosis and therapy rationale. Functional goals (SMART
      format). Frequency and duration (e.g., 2x/week x 6 weeks). Discharge criteria.
      Certification by the referring provider within 30 days.

  - id: pt-06
    category: functional_progress
    source_section: "5. Utilization Management Protocols > B. Continuation Authorizations"
    polarity: present
    text: >-
      Member demonstrates meaningful functional progress.

  - id: pt-07
    category: continuation_documentation
    source_section: "5. Utilization Management Protocols > A. Authorization Requirements"
    polarity: present
    text: >-
      Continuation (greater than 12 visits up to 24 visits): Prior authorization required with
      submission of: Progress report. Updated objective measures. Justification for continued
      skilled therapy.

  - id: pt-08
    category: documentation
    source_section: "6. Documentation Standards"
    polarity: present
    text: >-
      Objective measures (ROM, strength, endurance, gait, ADLs). Progress toward goals every 4
      visits.

  # The exclusions below are polarity: absent - they are satisfied when the record shows the
  # condition is NOT present, exactly like the TMS packs' seizure and implant contraindications.
  # Without the distinction every well-documented patient would read as failing every exclusion.
  - id: pt-09
    category: exclusion
    source_section: "5. Utilization Management Protocols > C. Denial Criteria"
    polarity: absent
    text: >-
      Services primarily for maintenance without evidence of skill need.

  - id: pt-10
    category: exclusion
    source_section: "5. Utilization Management Protocols > C. Denial Criteria"
    polarity: absent
    text: >-
      Duplicative services from multiple therapists without care coordination.

  - id: pt-11
    category: exclusion
    source_section: "5. Utilization Management Protocols > C. Denial Criteria"
    polarity: absent
    text: >-
      Lack of measurable improvement after 4-6 visits.

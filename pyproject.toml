[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attest"
version = "0.1.0"
description = "An AI agent that handles the prior authorization lifecycle for small specialty practices."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
  "strands-agents[gemini]",
  "strands-agents-tools",
  "bedrock-agentcore",
  "pydantic>=2",
  "pyyaml",
  "streamlit",
  "fpdf2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

# The policy packs live inside the package and must ship with it. Without this the built wheel
# contains only .py files - verified by inspecting one - so `load_pack` fails on any non-editable
# install while every editable install stays green. The synthetic corpus and the cassettes are
# repo assets rather than package assets and are located at runtime by `attest.paths`.
[tool.setuptools.package-data]
attest = ["policies/packs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on sys.path so tests can import root-level modules - `agent_runtime.py`,
# which AgentCore requires at the root of the image. Removed when P7-S3 was reverted, on the
# stated grounds that it should return alongside the step whose module needs it. It has.
pythonpath = ["."]
# Markers are generated from the step headings in PLAN.md. PLAN.md is the contract;
# tests/test_p0_s3.py::test_every_step_has_a_marker fails if the two ever drift.
markers = [
  "live: cannot be replayed from a cassette - needs a real API call. Provider-connectivity checks only.",
  "p0_s1: gate for step P0-S1",
  "p0_s2: gate for step P0-S2",
  "p0_s3: gate for step P0-S3",
  "p0_s4: gate for step P0-S4",
  "p1_s1: gate for step P1-S1",
